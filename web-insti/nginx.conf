server {
    listen 80;
    server_name localhost;

    root /code;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
